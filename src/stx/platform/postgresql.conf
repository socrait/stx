# -----------------------------
# PostgreSQL configuration file
# -----------------------------

# References used to choose configuration values:
# - https://www.crunchydata.com/blog/optimize-postgresql-server-performance
# - https://pgtune.leopard.in.ua/?dbVersion=17&osType=linux&dbType=web&cpuNum=2&totalMemory=8&totalMemoryUnit=GB&connectionNum=100&hdType=ssd

# This is required when running in Docker.
listen_addresses = '*'

# Don't use huge pages in the container.
huge_pages = off

# Assuming 8GB of RAM, we set shared_buffers to 25% ~ 2GB.
shared_buffers = 2GB

# Assuming 8GB of RAM, we set effective_cache_size to 60-75% ~ 5GB.
effective_cache_size = 5GB

# Best to keep this value relatively low, because it's a value for each database connection.
# If there are a lot of concurrent connections, the server may run out of memory.
work_mem = 10MB

# Unlike work_mem, this is a value for the whole server, so it can be higher.
maintenance_work_mem = 512MB

# WAL size for read-write balanced workloads on SSDs.
min_wal_size = 1GB
max_wal_size = 4GB

# Some other query optimizations suggested by pgtune.
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Locale
datestyle = 'iso, ymd'
timezone = 'UTC'

# Logging
logging_collector = on
log_statement='all'
log_duration=on
log_min_duration_statement = 1000  # 1 second

# Use UTF-8 encoding for client connections (default is SQL_ASCII).
client_encoding = utf8