# ulogd2 config for a box — NFLOG works in container netns, unlike iptables -j LOG.
# @ULOGD_PLUGIN_DIR@ is a template placeholder, substituted at container start.
# See docs/reference.md (Egress logs).

[global]
logfile="/var/log/ulogd.log"
loglevel=5
plugin="@ULOGD_PLUGIN_DIR@/ulogd_inppkt_NFLOG.so"
plugin="@ULOGD_PLUGIN_DIR@/ulogd_raw2packet_BASE.so"
plugin="@ULOGD_PLUGIN_DIR@/ulogd_filter_IFINDEX.so"
plugin="@ULOGD_PLUGIN_DIR@/ulogd_filter_IP2STR.so"
plugin="@ULOGD_PLUGIN_DIR@/ulogd_filter_PRINTPKT.so"
plugin="@ULOGD_PLUGIN_DIR@/ulogd_output_LOGEMU.so"

# stack= must be in [global], not a separate section — ulogd ignores it elsewhere.
stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,emu1:LOGEMU

[log1]
# Receive from NFLOG group 1 — matches --nflog-group 1 in the iptables rules.
group=1

[emu1]
file="/var/log/iptables/iptables.log"
sync=1
