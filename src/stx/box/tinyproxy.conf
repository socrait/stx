# CONNECT-based forward proxy for trusted-zone egress filtering — see docs/security.md.

Port 3128
Listen 127.0.0.1
Timeout 600
LogLevel Connect
LogFile "/var/log/stx/tinyproxy.log"
MaxClients 50

# Suppress identifying headers and error page branding. Without these, blocked
# requests return "Generated by tinyproxy" in the body and a Via header on every
# proxied response — both reveal that a filtering proxy is in the path.
DisableViaHeader Yes
DefaultErrorFile "/opt/stx/box/default-error.html"

# tinyproxy must run as root so that the iptables uid-owner 0 rule allows its
# outbound connections to allowlisted services. The box user cannot make
# direct external connections — only through this proxy.
User root
Group root

Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

# CONNECT tunnels HTTPS only — without this, a CONNECT to an allowlisted
# host's port 22 (or any other open port) would tunnel straight through;
# the hostname filter above says nothing about the port.
ConnectPort 443
